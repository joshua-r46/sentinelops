services:
  redis:
    image: redis:7-alpine
    container_name: shopstack-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  deployer:
    build: ./deployer
    image: shopstack-deployer:dev
    container_name: shopstack-deployer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://shopstack:shopstack_dev_password@postgres:5432/shopstack
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: shopstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopstack
      POSTGRES_USER: shopstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopstack -d shopstack"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    image: shopstack-api:dev
    container_name: shopstack-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://shopstack:shopstack_dev_password@postgres:5432/shopstack
      REDIS_URL: redis://redis:6379/0
      # Empty by default: failure control endpoints remain disabled until an
      # operator explicitly supplies this local development token.
      FAILURE_INJECTOR_TOKEN: ${FAILURE_INJECTOR_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./worker
    image: shopstack-worker:dev
    container_name: shopstack-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://shopstack:shopstack_dev_password@postgres:5432/shopstack
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agentshield:
    build: ./agentshield
    image: agentshield:phase2
    container_name: agentshield-monitor
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://shopstack:shopstack_dev_password@postgres:5432/shopstack
      SHOPSTACK_API_URL: http://api:8000
      DEPLOYER_URL: http://deployer:8001
      POLL_SECONDS: 15
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_DIAGNOSIS_TOKEN: ${LLM_DIAGNOSIS_TOKEN:-}
      LLM_GATEWAY_URL: http://agentshield-llm-gateway:8010
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-}
      TELEGRAM_SERVICE_URL: http://agentshield-telegram:8011
      TELEGRAM_SERVICE_TOKEN: ${TELEGRAM_SERVICE_TOKEN:-}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      deployer:
        condition: service_started

  agentshield-llm-gateway:
    build: ./agentshield
    image: agentshield:llm-gateway
    container_name: agentshield-llm-gateway
    restart: unless-stopped
    command: ["uvicorn", "llm_gateway:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-}
    networks: [default]

  agentshield-telegram:
    build: ./agentshield
    image: agentshield:telegram
    container_name: agentshield-telegram
    restart: unless-stopped
    command: ["uvicorn", "telegram:app", "--host", "0.0.0.0", "--port", "8011"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_SERVICE_TOKEN: ${TELEGRAM_SERVICE_TOKEN:-}
      TELEGRAM_APPROVER_TOKEN: ${TELEGRAM_APPROVER_TOKEN:-}
      TELEGRAM_QUEUE_TOKEN: ${TELEGRAM_SERVICE_TOKEN:-}
      TELEGRAM_STATE_DB: /data/telegram-state.sqlite3
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-false}
      TELEGRAM_STATUS_URL: http://agentshield:8002/health
      TELEGRAM_INCIDENTS_URL: http://agentshield:8002/incidents
      TELEGRAM_POLICY_URL: http://agentshield-policy:8003
    volumes:
      - telegram_state:/data
    networks: [default]

  docker-socket-proxy:
    profiles: ["phase4"]
    build:
      context: ./executor
      dockerfile: Dockerfile.socket-proxy
    container_name: agentshield-docker-filter
    restart: unless-stopped
    user: "65532:65532"
    environment:
      ALLOWED_CONTAINER_NAME: ${DOCKER_TARGET_CONTAINER:-shopstack-api}
      DOCKER_HOST: ${AGENTSHIELD_DOCKER_HOST:-}
    networks:
      - executor_socket

  agentshield-executor:
    profiles: ["phase4"]
    build: ./executor
    image: agentshield:phase4-executor
    container_name: agentshield-phase4-executor
    restart: unless-stopped
    environment:
      EXECUTOR_ENABLED: ${EXECUTOR_ENABLED:-false}
      EXECUTOR_SHARED_SECRET: ${EXECUTOR_SHARED_SECRET:-}
      EXECUTOR_STATE_DB: /data/executor.sqlite3
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      DOCKER_TARGET_CONTAINER: ${DOCKER_TARGET_CONTAINER:-shopstack-api}
    volumes:
      - executor_state:/data
    networks:
      - default
      - executor_socket
    depends_on:
      - docker-socket-proxy

  agentshield-verifier:
    profiles: ["phase5", "phase6"]
    build: ./agentshield
    image: agentshield:independent-verifier
    container_name: agentshield-independent-verifier
    restart: unless-stopped
    command: ["uvicorn", "verifier:app", "--host", "0.0.0.0", "--port", "8005"]
    environment:
      DATABASE_URL: postgresql://shopstack:shopstack_dev_password@postgres:5432/shopstack
      VERIFIER_TOKEN: ${VERIFIER_TOKEN:-}
      VERIFIER_API_URL: http://api:8000
      VERIFIER_WORKER_URL: http://worker:8004
      VERIFIER_PROBE_COUNT: ${VERIFIER_PROBE_COUNT:-3}
      VERIFIER_PROBE_INTERVAL: ${VERIFIER_PROBE_INTERVAL:-1}
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      agentshield:
        condition: service_started

  agentshield-snapshot-manager:
    profiles: ["phase6"]
    build: ./agentshield
    image: agentshield:snapshot-manager
    container_name: agentshield-snapshot-manager
    restart: unless-stopped
    command: ["uvicorn", "snapshots:app", "--host", "0.0.0.0", "--port", "8006"]
    environment:
      DATABASE_URL: postgresql://shopstack:shopstack_dev_password@postgres:5432/shopstack
      SNAPSHOT_TOKEN: ${SNAPSHOT_TOKEN:-}
      SNAPSHOT_INTEGRITY_KEY_FILE: /run/secrets/snapshot_integrity_key
      SNAPSHOT_API_URL: http://api:8000
      SNAPSHOT_DEPLOYER_URL: http://deployer:8001
    volumes:
      - ${SNAPSHOT_INTEGRITY_KEY_FILE:-./secrets/snapshot_integrity_key}:/run/secrets/snapshot_integrity_key:ro
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      agentshield:
        condition: service_started

  agentshield-recovery-policy:
    profiles: ["phase6"]
    build: ./agentshield
    image: agentshield:recovery-policy
    container_name: agentshield-recovery-policy
    restart: unless-stopped
    command: ["uvicorn", "recovery_policy:app", "--host", "0.0.0.0", "--port", "8007"]
    environment:
      DATABASE_URL: postgresql://shopstack:shopstack_dev_password@postgres:5432/shopstack
      SNAPSHOT_INTEGRITY_KEY_FILE: /run/secrets/snapshot_integrity_key
      RECOVERY_OPERATOR_TOKENS_JSON: ${RECOVERY_OPERATOR_TOKENS_JSON:-{}}
      RECOVERY_APPROVER_TOKENS_JSON: ${RECOVERY_APPROVER_TOKENS_JSON:-{}}
      RECOVERY_MAX_SNAPSHOT_AGE_SECONDS: ${RECOVERY_MAX_SNAPSHOT_AGE_SECONDS:-86400}
      RECOVERY_MAX_ATTEMPTS_PER_INCIDENT: ${RECOVERY_MAX_ATTEMPTS_PER_INCIDENT:-3}
      RECOVERY_EXECUTOR_ENABLED: ${RECOVERY_EXECUTOR_ENABLED:-false}
      RECOVERY_EXECUTOR_URL: http://agentshield-executor:8004
      RECOVERY_EXECUTOR_SHARED_SECRET: ${EXECUTOR_SHARED_SECRET:-}
      RECOVERY_VERIFIER_URL: http://agentshield-independent-verifier:8005
      RECOVERY_VERIFIER_TOKEN: ${VERIFIER_TOKEN:-}
      RECOVERY_VERIFIER_TIMEOUT_SECONDS: ${RECOVERY_VERIFIER_TIMEOUT_SECONDS:-360}
    volumes:
      - ${SNAPSHOT_INTEGRITY_KEY_FILE:-./secrets/snapshot_integrity_key}:/run/secrets/snapshot_integrity_key:ro
    networks:
      - default
    depends_on:
      - agentshield-snapshot-manager

  agentshield-policy:
    build: ./phase3policy
    image: agentshield:phase3-policy
    container_name: agentshield-phase3-policy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://shopstack:shopstack_dev_password@postgres:5432/shopstack
      EXECUTOR_ENABLED: ${EXECUTOR_ENABLED:-false}
      EXECUTOR_URL: http://agentshield-executor:8004
      EXECUTOR_SHARED_SECRET: ${EXECUTOR_SHARED_SECRET:-}
      EXECUTION_TOKEN: ${EXECUTION_TOKEN:-}
      VERIFIER_URL: http://agentshield-independent-verifier:8005
      VERIFIER_TOKEN: ${VERIFIER_TOKEN:-}
      APPROVER_TOKENS_JSON: ${APPROVER_TOKENS_JSON:-{}}
      APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-900}
      TELEGRAM_QUEUE_TOKEN: ${TELEGRAM_SERVICE_TOKEN:-}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
  executor_state:
  telegram_state:

networks:
  default:
  executor_socket:
    internal: true
